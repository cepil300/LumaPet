name: Build Web to Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies & Build Web
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps
            npm run build
          else
            mkdir -p dist
            cp -r *.html *.js *.css assets dist/ 2>/dev/null || true
          fi

      - name: Wrap with Capacitor Android
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "MeongMeong" "com.cepil300.meongmeong" --web-dir=dist || true
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeongMeong-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
